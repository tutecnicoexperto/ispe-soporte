# Firma los custom.txt de ispe/pruebas/*.json (diagnóstico) y los deja como artefacto.
name: ISPE firmar pruebas
on: workflow_dispatch
jobs:
  firmar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firmar
        env:
          ISPE_FIRMA: ${{ secrets.ISPE_FIRMA }}
        run: |
          pip3 install -q pynacl
          mkdir salida
          for j in ispe/pruebas/*.json; do python3 ispe/firmar_custom.py "$j" > "salida/$(basename "$j" .json).txt"; done
          ls -l salida
      - uses: actions/upload-artifact@v4
        with:
          name: custom-pruebas
          path: salida/*
