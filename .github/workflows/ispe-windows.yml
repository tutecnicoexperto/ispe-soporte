# Compila «ISPE Soporte» para Windows x64 a partir del RustDesk oficial + nuestra marca (ispe/).
#
# Se lanza a mano (Actions › ISPE Soporte Windows › Run workflow) indicando:
#   - version:  etiqueta oficial de RustDesk a usar (p. ej. 1.5.0)
#   - revision: nuestra revisión 1-9 → versión publicada 1.5.0-1, 1.5.0-2…
# Resultado: release <version>-<revision> en este repo con, por cada variante (ispe/variantes):
#   <App>-<ver>-x86_64.exe  (portable/instalable; es el que usa la actualización automática)
#   <App>-<ver>-x86_64.msi  (despliegue masivo / GPO)
# y actualiza ispe/latest.json, que es lo que consultan los equipos instalados una vez al día.
#
# Los pasos de compilación son los de .github/workflows/flutter-build.yml de RustDesk
# (job build-for-windows-flutter, solo x64), con la ruta del código en ./src.

name: ISPE Soporte Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión oficial de RustDesk (etiqueta)"
        required: true
        default: "1.5.0"
      revision:
        description: "Revisión ISPE (1-9)"
        required: true
        default: "1"
      publicar:
        description: "Publicar como última versión (activa la actualización automática)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Mismos valores que flutter-build.yml de RustDesk 1.5.0
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  ISPE_VER: "${{ inputs.version }}-${{ inputs.revision }}"
  # Python en Windows usa cp1252 por defecto: forzar UTF-8 (acentos en los textos de marca)
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # 1) Puente Flutter⇄Rust (se genera en Linux, igual que en RustDesk)
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar RustDesk ${{ inputs.version }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          submodules: recursive

      - name: Dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Generar el puente
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  # 2) DLL auxiliar de RustDesk (ventana superpuesta en modo privacidad)
  topmost:
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@v2
      - name: Compilar WindowInjection
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      - uses: actions/upload-artifact@v4
        with:
          name: topmost-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  # 3) Cliente Windows con marca ISPE + empaquetado por variante + release
  windows:
    needs: [bridge, topmost]
    runs-on: windows-2022
    defaults:
      run:
        working-directory: src
    steps:
      - name: Variables de caché de GitHub Actions (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Nuestro repo (marca y variantes)
        uses: actions/checkout@v4

      - name: Descargar RustDesk ${{ inputs.version }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          submodules: recursive
          path: src

      - name: Aplicar marca ISPE
        run: python ..\ispe\aplicar_marca.py . ${{ inputs.revision }}

      - name: Puente generado
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: src

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Motor Flutter de RustDesk + parche del desplegable
        shell: bash
        run: |
          flutter precache --windows
          curl -sSL -o windows-x64-release.zip https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
          unzip -q -o windows-x64-release.zip -d windows-x64-release
          cp -rf windows-x64-release/* "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter))) && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022
          workspaces: src

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Dependencias vcpkg
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Compilar
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Monitor virtual (usbmmidd) como en la build oficial
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk
          # Impresora remota (opcional: si falla la descarga se sigue sin ella)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile drv.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile adp.zip
            Expand-Archive drv.zip -DestinationPath .
            mkdir ./rustdesk/drivers
            mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
            Expand-Archive adp.zip -DestinationPath .
            mv -Force .\printer_driver_adapter.dll ./rustdesk
          } catch { Write-Host "Sin driver de impresora" }

      - name: Recursos del ejecutable para el empaquetador portable
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          [ -n "$runner_res" ] && cp "$runner_res" ./libs/portable/Runner.res || echo "Runner.res no encontrado"

      - name: DLL WindowInjection
        uses: actions/download-artifact@v4
        with:
          name: topmost-x64
          path: src/rustdesk

      - uses: microsoft/setup-msbuild@v2

      - name: Empaquetar variantes (exe + msi)
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pip3 install -q -r libs/portable/requirements.txt
          New-Item -ItemType Directory -Force -Path ../salida | Out-Null
          $ver = "${{ env.ISPE_VER }}"
          $verMsi = $ver.Replace("-", ".")
          # Una sola variante y SIN custom.txt: con custom.txt el servidor lanzado por el servicio
          # caía en bucle (21/10/2026); las opciones van compiladas (ispe/aplicar_marca.py).
          foreach ($app in @("ISPE-Soporte")) {
            $conn = ""
            Write-Host "=== $app ==="
            # Carpeta de la variante: ejecutable con el nombre de la app + su custom.txt firmado
            $dist = "dist-$app"
            if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
            Copy-Item -Recurse ./rustdesk $dist
            Move-Item "$dist/rustdesk.exe" "$dist/$app.exe"
            # Ejecutable autoextraíble (sirve para soporte puntual, para instalar y para actualizar)
            Push-Location libs/portable
            python3 ./generate.py -f "../../$dist/" -o . -e "../../$dist/$app.exe"
            Pop-Location
            Move-Item -Force ./target/release/rustdesk-portable-packer.exe "../salida/$app-$ver-x86_64.exe"
            # MSI
            git checkout -- res/msi
            Push-Location res/msi
            $arp = '{"Contact": {"msi": "ARPCONTACT", "v": "https://internetseguroparaempresas.com"}, "HelpLink": {"msi": "ARPHELPLINK", "v": "https://internetseguroparaempresas.com"}, "ReadMe": {"msi": "ARPREADME", "v": "https://internetseguroparaempresas.com"}}'
            $extra = @()
            if ($conn) { $extra = @("--conn-type", $conn) }
            python preprocess.py --arp -d "../../$dist" --app-name $app -v $verMsi -m "ISPE Internet Seguro para Empresas" --custom-arp $arp @extra
            nuget restore msi.sln
            msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=x64
            msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
            $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
            Pop-Location
            Move-Item -Force $msi.FullName "../salida/$app-$ver-x86_64.msi"
            git checkout -- res/msi
          }
          Get-ChildItem ../salida | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ispe-soporte-${{ env.ISPE_VER }}
          path: salida/*

      - name: Publicar release ${{ env.ISPE_VER }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ISPE_VER }}
          name: ISPE Soporte ${{ env.ISPE_VER }}
          body: |
            ISPE Soporte ${{ env.ISPE_VER }} (RustDesk ${{ inputs.version }} + marca ISPE, revisión ${{ inputs.revision }}).
            - **ISPE-Soporte**: `.exe` para soporte puntual o instalar (acceso desatendido); `.msi` para despliegue masivo. Sirve para clientes y técnicos.
            Servidor: remoto.negociosdigitalesonline.es. Código fuente: este repositorio + rustdesk/rustdesk ${{ inputs.version }} (AGPL-3.0).
          files: salida/*
          make_latest: ${{ inputs.publicar }}

      - name: Avisar a los equipos instalados (ispe/latest.json)
        if: ${{ inputs.publicar }}
        working-directory: .
        shell: bash
        run: |
          echo "{\"url\": \"https://github.com/${{ github.repository }}/releases/tag/${{ env.ISPE_VER }}\"}" > ispe/latest.json
          git config user.name "ISPE build"
          git config user.email "info@tutecnicoexperto.com"
          git add ispe/latest.json
          git commit -m "Última versión: ${{ env.ISPE_VER }}"
          git push
